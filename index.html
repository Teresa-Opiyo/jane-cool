<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jane Cool | Bride Villa wedding planner</title>
<meta name="description" content="A free, private wedding planner for weddings in Kenya, Africa and around the world: checklist, budget, guests, committee pledges and more.">
<meta name="theme-color" content="#8a1c5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#home" aria-label="Jane Cool, Bride Villa">Bride <span class="v">V</span>illa</a>
    <p class="tag"><b>Jane Cool</b> | Plan your wedding your way</p>
    <nav id="tabs" aria-label="Sections">
      <button data-tab="home">Home</button>
      <button data-tab="checklist">Checklist</button>
      <button data-tab="budget">Budget</button>
      <button data-tab="guests">Guests</button>
      <button data-tab="committee">Committee</button>
      <button data-tab="vendors">Vendors</button>
      <button data-tab="venues">Venues</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap foot">Jane Cool is free, made in loving memory of Jane. Your plan is saved only on this device. Bride Villa never holds or moves money.</footer>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
